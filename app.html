<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Listening Station</title>
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<noscript><p>This app needs JavaScript. Serve it over HTTP(S) and open it in a current browser.</p></noscript>
<div class="app" id="app">
  <header class="shell-top">
    <div class="brand">
      <h1>Spectrum Listening Station</h1>
      <p>Four channels, each listening to a spectrum of its own.</p>
    </div>
    <div class="right">
      <label class="switch" data-tip="Show a short explanation when you hover over or focus a control."><input type="checkbox" id="chkTips" checked> Tooltips</label>
      <div id="transport"><!-- Task 20: transport controls --></div>
    </div>
  </header>
  <section id="stage" class="shell-section" aria-label="Spectrum stage">
    <h2>Spectrum stage</h2>
    <div id="stage-host"><!-- Task 17b fills this: plot, range selector, monitors, readout --></div>
    <div id="layers"></div>
  </section>
  <section id="channels" class="shell-section" aria-label="Channels"><!-- Task 18 --></section>
  <section id="matrix" class="shell-section" aria-label="Modulation matrix"><!-- Task 19 --></section>
</div>
<div class="dock" id="dock"><!-- Task 20: mixer, capture, output --></div>
<div class="dropveil" id="dropveil">Drop spectrum files to add layers</div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
  // Classic script (not a module): ES modules and AudioWorklets cannot load from file://, so say so
  // instead of failing silently.
  if (location.protocol === 'file:') {
    document.body.innerHTML = '';
    var p = document.createElement('p');
    p.id = 'file-protocol-message';
    p.textContent = 'Serve this app over HTTP(S) (the audio engine cannot load from a file)';
    document.body.appendChild(p);
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
